name: Freshness

# Dependabot notices new versions. This notices when something breaks without one: an
# upstream deprecation, a transitive change, a tool that stopped supporting a version we use.
# Nobody has to read anything unless it goes red.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      # Ignore the lockfile and resolve everything to its newest allowed version.
      - run: uv sync --all-extras --all-groups --upgrade
      - run: uv run ruff check . && uv run pyright && uv run pytest
