name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The same gate developers and agents run locally (see CLAUDE.md).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: make install
      - run: make lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: make install
      - run: make test
