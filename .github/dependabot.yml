# Derived from the Databricks FDE starter template; modified for genie-app-workshop. See NOTICE.
version: 2
updates:
  # Grouped so a week of updates arrives as two pull requests rather than twenty.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
